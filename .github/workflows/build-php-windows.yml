name: Build PHP (Windows)

# Official windows.php.net NTS x64 builds + PECL extensions (Imagick, Redis, Xdebug, ...) compiled
# with php/php-windows-builder, packaged and smoke-tested. Published to the same php-<version>
# releases as the macOS builds, indexed in manifest-windows.json.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "PHP minor versions to build (space-separated)"
        default: "8.1 8.2 8.3 8.4 8.5"
      force:
        description: "Rebuild even if this version's Windows package already exists"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      extensions: ${{ steps.plan.outputs.extensions }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ inputs.versions || '8.1 8.2 8.3 8.4 8.5' }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          curl -fsSL https://downloads.php.net/~windows/releases/releases.json -o releases.json
          python3 - <<'PY'
          import json, os, subprocess
          releases = json.load(open("releases.json"))
          config = json.load(open("windows-extensions.json"))
          force = os.environ["FORCE"] == "true"
          versions, extensions = [], []
          for minor in os.environ["VERSIONS"].split():
              rel = releases.get(minor)
              if not rel:
                  print(f"::warning::No Windows release for PHP {minor}"); continue
              build = next((rel[k] for k in rel if k.startswith("nts-") and k.endswith("-x64")), None)
              if not build:
                  print(f"::warning::No NTS x64 build for PHP {minor}"); continue
              version = rel["version"]                     # e.g. 8.4.27-1
              base = version.split("-")[0]
              asset = f"php-{base}-windows-x64.zip"
              exists = subprocess.run(["gh", "release", "view", f"php-{base}", "-R", os.environ["GITHUB_REPOSITORY"],
                                       "--json", "assets", "-q", f'.assets[] | select(.name=="{asset}") | .name'],
                                      capture_output=True, text=True).stdout.strip()
              if exists and not force:
                  print(f"PHP {base} Windows package exists; skipping"); continue
              print(f"Will build PHP {version} for Windows")
              versions.append({"minor": minor, "version": version,
                               "zip": "https://downloads.php.net/~windows/releases/" + build["zip"]["path"]})
              for ext in config["extensions"]:
                  if minor in ext.get("skip", []): continue
                  extensions.append({"minor": minor, "name": ext["name"], "ref": ext["version"], "libs": ext.get("libs", "")})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"versions={json.dumps({'include': versions})}\n")
              out.write(f"extensions={json.dumps({'include': extensions})}\n")
              out.write(f"any={'true' if versions else 'false'}\n")
          PY

  extension:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.extensions) }}
    runs-on: windows-2022
    timeout-minutes: 90
    name: ${{ matrix.name }} ${{ matrix.ref }} (PHP ${{ matrix.minor }})
    steps:
      - name: Build
        uses: php/php-windows-builder/extension@v1
        with:
          extension-url: https://pecl.php.net/package/${{ matrix.name }}
          extension-ref: ${{ matrix.ref }}
          php-version: ${{ matrix.minor }}
          arch: x64
          ts: nts
          libs: ${{ matrix.libs }}
          run-tests: false

  package:
    needs: [plan, extension]
    # Package with whichever extensions built; the smoke test reports what's missing.
    if: always() && needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.versions) }}
    runs-on: windows-2022
    name: Package PHP ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: php_*
      - name: Assemble and smoke test
        shell: pwsh
        run: scripts/windows-package.ps1 -Version "${{ matrix.version }}" -ZipUrl "${{ matrix.zip }}" -Artifacts artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-php-${{ matrix.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.json
          if-no-files-found: error

  release:
    needs: [plan, package]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: windows-php-*
      - name: Publish releases and manifest-windows.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for meta in packages/*/php-*-windows-x64.json; do
            version=$(jq -r .php "$meta")
            tag="php-$version"
            # The macOS workflow may create the same release concurrently; tolerate that.
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "PHP $version" \
              --notes "PHP $version for Rigly. Extensions are listed in each build's .json." --latest=false || true
            base="${meta%.json}"
            gh release upload "$tag" "$base.zip" "$base.zip.sha256" "$meta" --clobber
          done
          gh release view manifest >/dev/null 2>&1 || \
            gh release create manifest --title "Manifest" --notes "Index of Rigly PHP builds (read by Rigly)." --latest=false || true
          gh release download manifest -p manifest-windows.json -O previous.json 2>/dev/null || echo '{"schema":1,"php":{}}' > previous.json
          python3 scripts/make-manifest.py packages "$GITHUB_REPOSITORY" previous.json > manifest-windows.json
          cat manifest-windows.json
          gh release upload manifest manifest-windows.json --clobber
